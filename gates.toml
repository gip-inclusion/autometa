# Dette de lint gelée au 2026-08-30, comptée par fichier et par règle.
# `scripts/check_lint_baseline.py` refuse toute violation neuve, et refuse aussi un compte devenu
# trop haut — la baseline se résorbe, elle ne s'étend pas. Ces deux règles remplacent le
# `ruff check --exit-zero` de `make lint`, qui affichait un compte sans jamais rien bloquer.
# S608 : SQL construit par interpolation. BLE001 : `except Exception` sans type précis.
[tool.lint_baseline]
rules = ["S608", "BLE001"]

[tool.lint_baseline.frozen]
".claude/hooks/guard_write_paths.py:BLE001" = 1
"alembic/versions/a1b2c3d4e5f6_text_to_datetime.py:S608" = 2
"benchmarks/card_retrieval.py:BLE001" = 2
"benchmarks/card_retrieval.py:S608" = 1
"lib/job_inputs.py:S608" = 1
"lib/webinaires.py:S608" = 5
"skills/debug_matomo_ui/scripts/ui_tester.py:BLE001" = 1
"skills/sync_metabase/scripts/sync_dashboards.py:BLE001" = 1
"tests/test_check_python.py:S608" = 1
"tests/test_webinaires.py:S608" = 11
"web/benchmark.py:BLE001" = 2
"web/conversation_embeddings/generate_conversation_embeddings.py:S608" = 1
"web/routes/conversations.py:BLE001" = 2
"web/selftest.py:BLE001" = 1
"web/sync_to_s3.py:BLE001" = 1


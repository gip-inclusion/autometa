    "web/routes/conversations.py:list_files",
    "web/routes/cron.py:run_task",
    "web/routes/cron.py:task_logs",
    "web/routes/cron.py:toggle_task",
    "web/routes/cron.py:view_script",
    "web/routes/html.py:explorations",
    "web/routes/html.py:rechercher_redirect",
    "web/routes/jobs.py:cancel_run",
    "web/routes/jobs.py:create_pipeline",
    "web/routes/jobs.py:run_events",
    "web/routes/jobs.py:run_output",
    "web/routes/jobs.py:run_status",
    "web/routes/jobs.py:trigger_run",
    "web/routes/knowledge.py:abandon_knowledge_changes",
    "web/routes/knowledge.py:commit_knowledge_changes",
    "web/routes/knowledge.py:get_knowledge_file",
    "web/routes/knowledge.py:get_staged_files",
    "web/routes/knowledge.py:list_knowledge",
    "web/routes/knowledge.py:preview_staged_file",
    "web/routes/query.py:query",
    "web/routes/reports.py:archive_report",
    "web/routes/reports.py:delete_report",
    "web/routes/reports.py:get_report",
    "web/routes/reports.py:get_report_tags",

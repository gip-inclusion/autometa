# Seuils de qualité de la CI.
#
# Séparé de `pyproject.toml` pour deux raisons : ce fichier est couvert par
# CODEOWNERS et abaisser un seuil doit rester un acte visible, alors que
# `pyproject.toml` porte aussi les dépendances et change plusieurs fois par jour.
#
# Référencé par `--cov-config` (coverage) et `--config-file` (diff-cover).

[tool.coverage.run]
branch = true
# Sans ce drapeau, `coverage combine` ne rapproche pas les mesures des deux couloirs de la CI,
# qui tournent dans des jobs distincts : les chemins absolus ne coïncident pas.
relative_files = true
# `skills/pdf/` est un skill Anthropic vendored, déjà exclu du lint pour la même raison.
omit = ["skills/pdf/*"]
source = ["web", "lib", "scripts", "skills"]
# Le JavaScript de `web/static/js/` n'y figure pas, et ce n'est pas un oubli : diff-cover lit
# `coverage.xml`, et il n'existe aucune suite de tests front qui pourrait le produire. Y déclarer
# le JavaScript ferait croire à une couverture mesurée. Son filet est `make lint-js` (Biome) — qui
# n'est pas encore dans les checks requis de `main`, donc consultatif tant qu'il n'y est pas.

[tool.coverage.report]
precision = 2
# Sans ce drapeau, coverage.py ne descend pas dans un répertoire dépourvu de `__init__.py` :
# `skills/` était déclaré en source sans qu'aucun de ses sous-répertoires ne soit mesuré.
include_namespace_packages = true
# Le plancher a baissé le 2026-08-18 parce que le périmètre a grandi, pas parce que
# l'exigence a baissé : `skills/` apporte 1262 instructions jamais exécutées, et la mesure
# passe de 76.96 % à 71.66 % sans qu'une ligne de code ait changé.
fail_under = 71.00

[tool.diff_cover]
fail_under = 90

# Routes FastAPI sans dépendance d'authentification, gelées au 2026-08-17.
# `scripts/check_route_auth.py` refuse toute route neuve absente de cette liste, et refuse
# aussi une entrée devenue inutile — la baseline se résorbe, elle ne s'étend pas.
# `web/routes/query.py:query` exécute du SQL fourni par le client : traité à part.
[tool.route_auth]
allowlist = [
    "web/app.py:serve_interactive",
    "web/routes/auth.py:status",
    "web/routes/conversations.py:get_conversation_tags",

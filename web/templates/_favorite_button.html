{% set is_favorite = (item_type, item_id|string) in favorite_ids %}
{% set favorite_label = 'Retirer des favoris' if is_favorite else 'Ajouter aux favoris' %}
<button type="button"
        class="{{ btn_class|default('conv-item-action-btn') }} favorite-btn{% if is_favorite %} is-favorite{% endif %}"
        title="{{ favorite_label }}"
        aria-label="{{ favorite_label }}"
        aria-pressed="{{ 'true' if is_favorite else 'false' }}"
        data-item-type="{{ item_type }}" data-item-id="{{ item_id }}"
        onclick="event.preventDefault(); event.stopPropagation(); toggleFavorite(this)">
  <i class="{% if is_favorite %}ri-star-fill{% else %}ri-star-line{% endif %}" aria-hidden="true"></i>
</button>

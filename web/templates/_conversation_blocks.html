{% for block in blocks -%}
<div class="event-block event-{{ block.kind }}{% if block.report %} event-report{% endif %}{% if block.final %} event-final-answer{% endif %}{% if block.slack %} from-slack{% endif %}" data-msg-id="{{ block.ids | join(' ') }}"{% if block.partial %} data-partial{% endif %}{% if block.kind == "user" %} data-question="{{ block.question }}"{% endif %}>{% if block.slack %}<div class="event-origin"><span class="event-origin-who"></span> (<i class="ri-slack-line" aria-hidden="true"></i> depuis Slack)</div>{% endif %}{{ block.html }}{% if block.references %}<div class="action-footnotes">{{ block.references | join }}</div>{% endif %}</div>
{% endfor %}

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Les jobs appellent les cibles du `Makefile` plutôt que de réécrire les commandes : sans cela,
# « la CI relance le même check » est faux, et la dérive s'installe sans que personne la voie —
# un CVE ignoré d'un côté et pas de l'autre, un périmètre de lint différent.

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `check_test_quality --base` lit la version d'avant de chaque fichier de test :
          # un checkout superficiel la lui cacherait, et le check passerait sans rien comparer.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --group dev --frozen
      # BASE sert à `check_test_quality --base` : comparer les assertions d'un test préexistant
      # exige de savoir contre quoi. En local, la valeur par défaut `main` fait l'affaire.
      - run: make lint BASE=${{ github.base_ref || 'main' }}

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --group dev --frozen

      - name: Bandit, protection des routes, dérive des checks requis
        env:
          GH_TOKEN: ${{ github.token }}
        run: make security

      # Why: pip-audit scanne l'arbre de dépendances, pas le diff — il rougit sur une publication
      # de CVE amont, à un moment que personne ne choisit. Mesuré : 11 des 12 échecs du job Security
      # sur 117 runs. Le signal reste visible sur chaque PR, il n'immobilise plus une PR sans rapport.
      - name: pip-audit
        continue-on-error: true
        run: |
          uv export --frozen --no-hashes --no-emit-project > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2026-3219

      - name: Gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE_SHA..$AFTER_SHA"
          fi
          if [ -n "$range" ]; then
            ./gitleaks detect --source . -v --log-opts="$range"
          else
            ./gitleaks detect --source . -v
          fi

      - name: CODEOWNERS actif
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          errors=$(gh api "repos/${{ github.repository }}/codeowners/errors?ref=$REF" --jq '.errors | length')
          if [ "$errors" != "0" ]; then
            gh api "repos/${{ github.repository }}/codeowners/errors?ref=$REF" \
              --jq '.errors[] | "ligne \(.line) : \(.message)"'
            echo "::error::$errors entrée(s) de CODEOWNERS sont inertes — GitHub les ignore sans erreur."
            exit 1
          fi

      - name: Dérive des checks requis
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_required_checks.py

  unit:
    name: Tests unit (sans services)
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.unit
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --group dev --frozen
      - name: Unit tests (no services)
        run: make test-unit-cov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: .coverage.unit
          include-hidden-files: true
          if-no-files-found: error

  integration:
    name: Tests integration (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: autometa
          POSTGRES_PASSWORD: autometa
          POSTGRES_DB: autometa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
    env:
      DATABASE_URL: postgresql://autometa:autometa@localhost:5432/autometa_test
      REDIS_URL: redis://localhost:6379/0
      COVERAGE_FILE: .coverage.integration
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install pgvector in PostgreSQL service
        run: |
          docker exec -u root "${{ job.services.postgres.id }}" apt-get update
          docker exec -u root "${{ job.services.postgres.id }}" apt-get install -y --no-install-recommends postgresql-18-pgvector
      - run: uv sync --group dev --frozen
      - name: Integration tests
        run: make test-integration-cov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: Couverture fusionnée + diff-cover
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --group dev --frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine + report (plancher défini dans gates.toml)
        run: make coverage-report
      - name: Diff coverage gate
        run: make diff-cover BASE=${{ github.base_ref || 'main' }}

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: autometa
          POSTGRES_PASSWORD: autometa
          POSTGRES_DB: autometa_migcheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://autometa:autometa@localhost:5432/autometa_migcheck
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install pgvector in PostgreSQL service
        run: |
          docker exec -u root "${{ job.services.postgres.id }}" apt-get update
          docker exec -u root "${{ job.services.postgres.id }}" apt-get install -y --no-install-recommends postgresql-18-pgvector
      - run: uv sync --group dev --frozen
      - name: Apply migrations on a fresh DB (catches broken chain)
        run: make migrate
      - name: Check models match migrations, and backfills before NOT NULL
        run: make check-migrations

  lint-js:
    name: Lint front (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: make lint-js

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Hadolint
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64 -o hadolint
          chmod +x hadolint
          ./hadolint Dockerfile --failure-threshold error

      - name: Build
        run: docker build . --tag autometa:ci

  review-app:
    name: Review app
    needs: [lint, security, unit, integration, migrations]
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: review-app
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    concurrency:
      group: review-app-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - run: uv sync --group dev --frozen

      - name: Reconcile review app
        id: reconcile
        env:
          SCALINGO_TOKEN: ${{ secrets.SCALINGO_REVIEW_APP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pr=$(gh api "repos/$REPO/pulls/$PR" --jq '"\(.state) \(.draft)"')
          if [ "$pr" != "open false" ]; then
            echo "PR #$PR est '$pr' : le teardown a déjà pu passer, on ne crée rien."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result=$(printf '%s' "$SCALINGO_TOKEN" \
            | uv run python scripts/review_app.py ensure --app autometa-staging --pr "$PR" --sha "$HEAD_SHA")
          echo "$result"
          url=$(echo "$result" | jq -er '.url | select(. != null and . != "")')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub deployment
        if: steps.reconcile.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.reconcile.outputs.url }}
        run: |
          deployment_id=$(jq -n --arg ref "$HEAD_SHA" --arg env "review-app-pr-$PR" \
            '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [],
              transient_environment: true, description: "Scalingo review app"}' \
            | gh api "repos/$REPO/deployments" --input - --jq .id)
          jq -n --arg url "$URL" '{state: "success", environment_url: $url, description: "Review app déployée"}' \
            | gh api "repos/$REPO/deployments/$deployment_id/statuses" --input - > /dev/null

services:
  db:
    # postgis/postgis ne publie pas d'image arm64 : émulation nécessaire sur Apple Silicon.
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autometa
      POSTGRES_PASSWORD: autometa
      POSTGRES_DB: autometa
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autometa"]
      interval: 2s
      timeout: 3s
      retries: 15

  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=autometa
      - RUSTFS_SECRET_KEY=autometa
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 1s
      timeout: 3s
      retries: 15

  rustfs-init:
    image: amazon/aws-cli:2.37.6
    restart: "no"
    environment:
      - AWS_ACCESS_KEY_ID=autometa
      - AWS_SECRET_ACCESS_KEY=autometa
      - AWS_DEFAULT_REGION=fr-par
    entrypoint: ["/bin/sh", "-c"]
    command: ["aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket autometa || aws --endpoint-url http://rustfs:9000 s3 mb s3://autometa"]
    depends_on:
      rustfs:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles:
      - ollama
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  rustfs_data:
  ollama_data:

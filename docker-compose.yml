services:
  db:
    # postgis/postgis ne publie pas d'image arm64 : émulation nécessaire sur Apple Silicon.
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autometa
      POSTGRES_PASSWORD: autometa
      POSTGRES_DB: autometa
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autometa"]
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    # quay.io/minio/minio a fermé les pulls anonymes le 24/09/2026 ; bitnamilegacy est le
    # dernier miroir gratuit de la community edition (gelé depuis 2025-07, pas de licence requise).
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      - MINIO_CONSOLE_ADDRESS=:9001
      - MINIO_ROOT_USER=autometa
      - MINIO_ROOT_PASSWORD=autometa
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 3s
      retries: 3

  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    restart: "no"
    environment:
      - MC_HOST_local=http://autometa:autometa@minio:9000
    command: "mc mb --ignore-existing local/autometa"
    depends_on:
      minio:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles:
      - ollama
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  minio_data:
  ollama_data:

[project]
name = "autometa"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    # Web framework
    "fastapi>=0.135.2",
    "uvicorn[standard]>=0.42.0",
    "python-multipart>=0.0.31",
    # Templating
    "jinja2>=3.1.6",
    "markupsafe>=3.0.3",
    "markdown>=3.10",
    "nh3>=0.2.18",
    # Utils
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    # Database
    "psycopg2-binary>=2.9.11",
    # S3-compatible object storage
    "boto3>=1.42.78",
    "sqlalchemy>=2.0.48",
    "alembic>=1.18.4",
    "redis[hiredis]>=5.0.0",
    "httpx>=0.28.1",
    "sshtunnel>=0.4.0",
    "paramiko>=5.0.0",
    "sentry-sdk[fastapi,sqlalchemy,httpx,opentelemetry,pure_eval]>=2.29.0",
    "idna>=3.15",
    # OpenTelemetry — tracing primitive, Sentry is the backend.
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    # Data analysis & file formats — used by agent crons/scripts (separate processes),
    # never imported by the web app, so they cost no RAM in the web workers.
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.2.0",
    "xlrd>=2.0.1",
    "pdfplumber>=0.11.0",
    "pillow>=12.3.0",
    "model2vec>=0.8.2",
]

[project.scripts]
autometa = "web.app:main"
generate-conversation-embeddings = "web.conversation_embeddings.generate_conversation_embeddings:main"
sync-sites = "skills.sync_sites.scripts.sync_sites:main"
sync-inventory = "skills.sync_metabase.scripts.sync_inventory:main"
sync-webinaires = "lib.webinaires:main"
slack-feedback = "web.slack_feedback:main"

[tool.uv]
# cryptography < 50 : PYSEC-2026-3552 (dépendance transitive de paramiko)
constraint-dependencies = ["urllib3>=2.7.0", "cryptography>=50.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web", "lib", "skills"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.8",
    "bandit>=1.9.4",
    "pip-audit>=2.10.0",
    "fakeredis>=2.34.1",
    "pytest-cov>=7",
    "diff-cover>=9",
    "pre-commit>=4.6.1",
    "pytest-playwright>=0.7.1",
]

# =============================================================================
# Ruff — linting & formatting
# =============================================================================

[tool.ruff]
target-version = "py314"
line-length = 120
# evals/: experimental evaluation scripts, intentionally loose style
# skills/pdf/: vendored Anthropic skill (proprietary upstream) — don't reformat
exclude = ["data/", ".venv/", "evals/", "skills/pdf/"]

[tool.ruff.lint]
preview = true
# Anti-slop : tests creux/fragiles (PT0xx/B011) + assertions tautologiques (PLR0124 self-compare, PLW0129 str)
select = [
    "E", "F", "W", "I", "G", "B011", "PT010", "PT012", "PT015", "PT017", "PT027", "PLR0124", "PLW0129",
    # Règles de .claude/rules/code.md rendues exécutables — mesurées à 0 violation
    "E722",   # except nu
    # S113 ne voit qu'un appel littéral, pas un httpx.Client() construit sans timeout puis
    # réutilisé — la forme de lib/matomo.py, lib/metabase.py, lib/rpe.py, lib/zendesk.py et
    # lib/webinaires.py. Ces modules restent conformes en repassant timeout= à chaque appel,
    # mais rien ne l'impose : ce risque n'est pas couvert.
    "S113",   # appel HTTP sans timeout littéral
    "TID251", # imports et APIs bannis, configurés ci-dessous
    "TID252", # imports relatifs parents
]
ignore = [
    "E501",   # line length — enforce progressively, not retroactively
    "G001",   # logging-string-format — `.format()` is acceptable in this codebase
    "G002",   # logging-percent-format — same
]

# Motifs recopiés de .claude/hooks/check_python.py : la règle réelle bannit
# urllib.request et urllib3, pas urllib.parse, qui est légitimement utilisé.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Utiliser httpx."
"urllib.request".msg = "Utiliser httpx."
"urllib3".msg = "Utiliser httpx."
"unittest".msg = "Utiliser pytest."
"unittest.mock".msg = "Utiliser le fixture mocker de pytest-mock."
"psycopg2".msg = "Utiliser SQLAlchemy, ou lib.data_inclusion pour le tunnel SSH."
"os.getenv".msg = "Toute lecture de configuration passe par web/config.py."
"os.environ".msg = "Toute lecture de configuration passe par web/config.py."

[tool.ruff.lint.per-file-ignores]
"web/app.py" = ["E402"]              # imports after logging setup
"tests/test_knowledge_sync.py" = ["E402"]  # sys.path setup before imports
"tests/test_uploads.py" = ["E402"]         # env config before imports
"tests/conftest.py" = ["E402", "TID251"]   # DATABASE_URL override before imports ; crée la base de test
"browser/conftest.py" = ["TID251"]         # cible et identifiants du runner, hors configuration applicative
"web/config.py" = ["TID251"]               # le module de configuration lui-même
# Hooks et déployables séparés : processus hors application, sans accès à web.config
".claude/hooks/*.py" = ["TID251"]
"infra/scaleway/s3_backup/config.py" = ["TID251"]

# Les seuils de couverture vivent dans gates.toml — voir ce fichier.

# =============================================================================
# Bandit — SAST
# =============================================================================

[tool.bandit]
# `skills/` en a été retiré le 2026-08-18 : ce sont des scripts exécutables qui écrivent
# en base et sur S3, mesurés à 0 issue medium/high avant l'inclusion.
exclude_dirs = ["tests", "evals", "data"]
skips = [
    "B704",  # markupsafe.Markup — used intentionally to render agent-generated markdown
]

[tool.ruff.format]
preview = true

# Liste fermée des préparations qu'un agent peut faire tourner avant son run (champ preparations
# du format pdi.agent/1). Chacune nomme une tâche du dossier cron/ ; Autometa les exécute dans
# l'ordre de la configuration, publie leurs sorties et les transmet au run. Le worker ne lance
# jamais de cron.
#
# Une préparation nouvelle s'ajoute par une PR : une tâche dans cron/, une ligne ici.

preparations:
  - id: connecteurs.inventaire
    cron: sync-connectors

  - id: metabase.inventaire
    cron: sync-inventory

  - id: tags.vocabulaire
    cron: sync-tags

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-test-quality
        name: check test quality
        entry: uv run --frozen python scripts/check_test_quality.py
        language: system
        files: ^tests/.*\.py$
      - id: unit-suite
        name: suite unit hermétique (avant commit)
        entry: make test
        language: system
        stages: [pre-commit]
        pass_filenames: false
        files: \.py$
